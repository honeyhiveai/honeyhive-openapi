openapi: 3.1.0
info:
  title: HoneyHive Control Plane API
  description: |
    Manage HoneyHive control-plane resources: organizations with their roles, templates and
    members, workspaces with their templates and members, projects with their members and
    alerts, and read org usage.

    Authentication requires a fine-grained control-plane API key (values
    start with `hh_fgcp_`), sent as `Authorization: Bearer <api-key>`.
    Classic API keys used with the Data Plane API will not work here. Create
    a key in the HoneyHive app under an organization's or workspace's
    **Settings → API Keys**, or see
    [Authorization](https://docs.honeyhive.ai/v2/control-plane-sdk-reference/typescript#authorization)
    for details.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 1.20.0
servers:
  - url: https://api.cp.us.honeyhive.ai
tags:
  - name: Alerts
    description: |
      Define and manage alerts. Alerts evaluate event metrics on a schedule and trigger notifications when configured thresholds are crossed.
  - name: Org Members
    description: |
      List an organization's members, invite people to it, set a member's roles, and remove people from it and from everything in it. Available on self-hosted deployments that do not enable an SSO group scheme.
  - name: Org Templates
    description: |
      Read and replace an organization's templates manifest, which defines the metrics and charts that new projects start with. Each workspace gets its own copy when it is created, so a new version reaches an existing workspace's projects only where that workspace's manifest merges with the organization's.
  - name: Orgs
    description: |
      Read an organization's display name and the email domains whose users join it automatically when they sign in, and update its display name.
  - name: Project Members
    description: |
      List a project's members, invite people to it, set a member's roles, and remove people from it. Available on self-hosted deployments that do not enable an SSO group scheme.
  - name: Projects
    description: |
      Create and manage projects within a workspace. A project is the container for the events, datasets, evaluations, and alerts logged against it.
  - name: Retention Policies
    description: |
      Read and replace scope retention windows, or remove an override to restore inheritance. A window sets how long data is kept. The retention expiry job of the data plane that hosts the data deletes what a window no longer keeps, where that job is enabled, and deleted data cannot be recovered. max_age_days expires a session with all of its events, by the start of the session. experiment_max_age_days expires an experiment run with its sessions, by the creation of the run. Two kinds of session are kept whatever the windows are: a session of an experiment run whose record was deleted, and a session that has no session event.
  - name: Roles
    description: |
      Read and replace an organization's roles manifest, which defines its roles and the permissions each one grants. Available on self-hosted deployments only.
  - name: Usage
    description: |
      Read an organization's usage: events and computed metrics per calendar month, and current user, workspace and project counts.
  - name: Virtual Dataplanes
    description: |
      Create and manage virtual data planes. A virtual data plane is a logical tenant boundary inside an organization, hosted on a physical cluster; several virtual data planes commonly share one cluster. Workspaces live inside a virtual data plane.
  - name: Workspace Members
    description: |
      List a workspace's members, invite people to it, set a member's roles, and remove people from it and from every project in it. Available on self-hosted deployments that do not enable an SSO group scheme.
  - name: Workspace Templates
    description: |
      Read and replace a workspace's templates manifest, which defines the metrics and charts that new projects in the workspace start with.
  - name: Workspaces
    description: |
      Read and manage workspaces. A workspace groups the projects belonging to one team or environment, and owns the API keys and AI provider secrets its projects share.
paths:
  /v1/orgs/{org_id}/retention_policy:
    get:
      tags:
        - Retention Policies
      operationId: getOrgRetentionPolicy
      security:
        - ControlPlaneApiKey: []
      x-ts-sdk-name: getOrg
      x-cli-name: get-org
      summary: Get an org retention policy
      description: |
        Requires org.retention_policy.get at the scope in the URL.
        The key must cover that scope. Scope headers do not select the target.
        Returns the explicit policy, if present, and the effective policy with its source scope.
        The nearest current policy supplies both windows. Fields are not merged across scopes.
        When no scope in the lineage has a current policy, effective_policy is null and data is
        retained indefinitely.
      parameters:
        - in: path
          name: org_id
          required: true
          description: The org whose retention policy is requested.
          schema:
            type: string
      responses:
        '200':
          description: The scope's explicit and effective retention policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRetentionPolicyResponse'
        '400':
          description: An ancestor scope is archived.
        '404':
          description: The scope is missing, archived, or inaccessible to this caller.
    put:
      tags:
        - Retention Policies
      operationId: replaceOrgRetentionPolicy
      security:
        - ControlPlaneApiKey: []
      x-ts-sdk-name: replaceOrg
      x-cli-name: replace-org
      summary: Replace an org retention policy
      description: |
        Requires org.retention_policy.put at the scope in the URL.
        The key must cover that scope. Scope headers do not select the target.
        Replaces both windows. Both fields are required. Null retains data indefinitely.
        A shorter window makes older data expire. Runs of the retention expiry job delete it, and a
        large amount of expired data can take more than one run. Deleted data cannot be recovered.
        An explicit policy overrides inherited windows, including when both values are null.
        Creates a new policy version and preserves the previous version for audit.
      parameters:
        - in: path
          name: org_id
          required: true
          description: The org whose retention policy is requested.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutRetentionPolicyRequest'
      responses:
        '200':
          description: The scope's explicit and effective retention policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRetentionPolicyResponse'
        '400':
          description: Invalid retention windows or an archived ancestor.
        '404':
          description: The scope is missing, archived, or inaccessible to this caller.
    delete:
      tags:
        - Retention Policies
      operationId: deleteOrgRetentionPolicy
      security:
        - ControlPlaneApiKey: []
      x-ts-sdk-name: deleteOrg
      x-cli-name: delete-org
      summary: Delete an org retention policy
      description: |
        Requires org.retention_policy.delete at the scope in the URL.
        The key must cover that scope. Scope headers do not select the target.
        Retires this scope's current override and returns the inherited effective policy.
        Preserves prior policy values and records the retiring actor, time, and cleared reason.
        Repeated deletion is safe when no override exists.
      parameters:
        - in: path
          name: org_id
          required: true
          description: The org whose retention policy is requested.
          schema:
            type: string
      responses:
        '200':
          description: The scope's explicit and effective retention policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRetentionPolicyResponse'
        '400':
          description: An ancestor scope is archived.
        '404':
          description: The scope is missing, archived, or inaccessible to this caller.
